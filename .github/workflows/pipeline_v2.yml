name: Pipeline v2 (fmp pool - universe, fundamentals, filing library)

# WHY THIS EXISTS (owner, 24 Sep 2026). fmp now reads deeply every US company worth >= $22.7B and buys by market
# value, and the old jobs (sec.yml's every-filer build + the daily patch + events) kept feeding those reads wrong debt,
# capex, revenue and share counts. This one job does it all for that pool: 2 bulk SEC downloads, our own market value
# from every share class on the latest cover, corrected fundamentals, and the filing library (EVERYTHING mode).
#
# PARALLEL WEEK: it writes ONLY data/v2/ on this branch and the `filings-v2` library branch. data/companies,
# data/events, data/tickers.json and the `filings` branch stay with the old jobs, which fmp's live autopilot reads.
# data/v2/compare.md says, per company, where v2 and the old build differ by > 5%; the week is judged on it.

on:
  schedule:
    # 09:30 UTC daily: after the events feed (03:00) and the companies patch (07:00), before filings.yml (10:30)
    # and fmp's weekday routine (16:00). The SEC's bulk files are rebuilt nightly.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      only_tickers:
        description: "Comma-separated tickers for a smoke test (per-company APIs, nothing committed)"
        default: ""
        required: false
      limit:
        description: "Only the N largest companies (smoke test, nothing committed); 0 = all"
        default: "0"
        required: false
      library:
        description: "Update the filing library (true/false)"
        default: "true"
        required: false
      max_new_docs:
        description: "Library documents fetched this run at most (the rest come on later runs)"
        default: "20000"
        required: false

permissions:
  contents: write

concurrency:
  group: pipeline-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests yfinance pandas pypdf pytest

      - name: Refuse an empty script
        run: |
          test -s pipeline_v2.py || { echo "pipeline_v2.py is empty"; exit 1; }
          test -s fetch_filings.py || { echo "fetch_filings.py is empty"; exit 1; }

      - name: Prove the pipeline first
        run: python -m pytest -q tests/test_pipeline_v2.py tests/test_fetch_filings.py

      - name: Get the current library (filings-v2, else the old filings branch, else empty)
        if: inputs.library != 'false'
        run: |
          for b in filings-v2 filings; do
            git clone --quiet --depth 1 --branch "$b" --single-branch \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" filings-store \
              && { echo "library from $b"; break; }
          done
          mkdir -p filings-store

      - name: Run pipeline v2
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ONLY_TICKERS: ${{ inputs.only_tickers || '' }}
          LIMIT: ${{ inputs.limit || '0' }}
          LIBRARY: ${{ inputs.library || 'true' }}
          MAX_NEW_DOCS: ${{ inputs.max_new_docs || '20000' }}
          FILINGS_STORE: filings-store
          PYTHONUNBUFFERED: "1"
        run: python pipeline_v2.py

      - name: Nothing outside data/v2 changed
        # The parallel week's one hard rule: the old outputs fmp reads are never touched by this job.
        run: |
          git status --porcelain -- . ':!data/v2' ':!filings-store' ':!work' | tee /tmp/outside
          test ! -s /tmp/outside || { echo "pipeline v2 wrote outside data/v2"; exit 1; }

      - name: Publish the library (overwrite filings-v2, one commit, no history)
        if: inputs.library != 'false'
        run: |
          cd filings-store
          test -d .git || git init --quiet
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --quiet --orphan snapshot
          git add -A
          git commit -q -m "Filing library v2 $(date -u +%Y-%m-%d) [skip ci]"
          git push -q -f origin snapshot:filings-v2

      - name: Commit data/v2 (full runs only)
        if: (inputs.only_tickers || '') == '' && (inputs.limit || '0') == '0'
        run: |
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v2/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "Pipeline v2 $(date -u +%Y-%m-%d) [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              echo "push rejected - remote moved; rebasing onto it and retrying"
              git fetch --unshallow origin "$GITHUB_REF_NAME" 2>/dev/null || git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            }
          fi
