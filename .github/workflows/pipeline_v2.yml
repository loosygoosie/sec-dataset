name: Pipeline v2 (fmp pool - universe, fundamentals, filing library)

# WHY THIS EXISTS (owner, 24 Sep 2026). fmp now reads deeply every US company worth >= $22.7B and buys by market
# value, and the old jobs (sec.yml's every-filer build + the daily patch + events) kept feeding those reads wrong debt,
# capex, revenue and share counts. This one job does it all for that pool: 2 bulk SEC downloads, share counts from
# every class on the latest cover, corrected fundamentals, and the filing library.
#
# NO PRICES (owner, 25 Sep 2026: "we shouldn't be using yahoo for anything anymore"): which companies to keep is
# decided from SEC figures alone (pipeline_v2.size_gate); fmp prices them with Robinhood.
# SPEED: the cover XBRL instances are kept across runs (actions/cache, work/v2/xbrl), so a normal night fetches only
# the new 10-Qs and 10-Ks, 6 at a time under the shared 8 requests/s.
#
# LIBRARY ON DEMAND ONLY (owner, 25 Sep 2026: "switch the library to on-demand only"): the nightly run skips it (it
# took up to 3 hours of SEC requests and blocked every other run); dispatch with library=true to update it. fmp's
# signal scripts fetch the filings they need with owner/fetch_company.py.
# LIBRARY (owner, 25 Sep 2026: "fetch everything"): library.py keeps EVERY filing of the last 3 years and every document
# in it, per company, as RELEASE ASSETS on the `library` tag (<cik>.tar.gz + index.json), not in a git branch.
# Only filings not saved yet are fetched; an asset is replaced only when its company changed.
#
# PARALLEL WEEK: it writes ONLY data/v2/ on this branch and the `library` release assets. data/companies,
# data/events and data/tickers.json stay with the old jobs, which fmp's live autopilot reads. (filings.yml and its
# `filings` branch were retired on 25 Sep 2026: nothing read them once the `library` release existed.)
# data/v2/compare.md says, per company, where v2 and the old build differ by > 5%; the week is judged on it.

on:
  schedule:
    # 09:30 UTC daily: after the events feed (03:00) and the companies patch (07:00), before fmp's weekday
    # routine (16:00). The SEC's bulk files are rebuilt nightly.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      only_tickers:
        description: "Comma-separated tickers for a smoke test (per-company APIs, nothing committed)"
        default: ""
        required: false
      limit:
        description: "Only the N largest companies (smoke test, nothing committed); 0 = all"
        default: "0"
        required: false
      library:
        description: "Update the filing library (true/false; ON DEMAND only since 25 Sep 2026, never nightly)"
        default: "false"
        required: false
      library_minutes:
        description: "Minutes the library may spend fetching (the rest come on later runs)"
        default: "180"
        required: false
      max_new_filings:
        description: "Library filings fetched this run at most; 0 = no cap"
        default: "0"
        required: false

permissions:
  contents: write

concurrency:
  # a smoke test (limit / only_tickers) does not queue behind a nightly run of several hours
  group: pipeline-v2-${{ ((inputs.limit || '0') != '0' || (inputs.only_tickers || '') != '') && 'smoke' || 'full' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests pandas pypdf pytest

      - name: Restore the cover-instance cache
        # a new key each run (caches are immutable); restore-keys picks up the latest one
        uses: actions/cache@v4
        with:
          path: work/v2/xbrl
          key: v2-xbrl-${{ github.run_id }}
          restore-keys: v2-xbrl-

      - name: Refuse an empty script
        run: |
          test -s pipeline_v2.py || { echo "pipeline_v2.py is empty"; exit 1; }
          test -s fetch_filings.py || { echo "fetch_filings.py is empty"; exit 1; }
          test -s library.py || { echo "library.py is empty"; exit 1; }

      - name: Prove the pipeline first
        run: python -m pytest -q tests/test_pipeline_v2.py tests/test_golden.py tests/test_fetch_filings.py tests/test_library.py

      - name: Make sure the library release exists
        if: inputs.library == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view library --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create library --repo "${{ github.repository }}" --target main --latest=false \
              --title "Filing library (every filing of the last 3 years, per company)" \
              --notes "One <cik>.tar.gz per company (text of every document, xbrl/, forms/, manifest.json) plus index.json. Replaced nightly by pipeline_v2.yml when a company files. See README.md, Filing library."

      - name: Run pipeline v2
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ONLY_TICKERS: ${{ inputs.only_tickers || '' }}
          LIMIT: ${{ inputs.limit || '0' }}
          LIBRARY: ${{ inputs.library || 'false' }}
          LIBRARY_MINUTES: ${{ inputs.library_minutes || '180' }}
          MAX_NEW_FILINGS: ${{ inputs.max_new_filings || '0' }}
          LIBRARY_TAG: library
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline_v2.py

      - name: Nothing outside data/v2 changed
        # The parallel week's one hard rule: the old outputs fmp reads are never touched by this job.
        run: |
          git status --porcelain -- . ':!data/v2' ':!filings-store' ':!work' | tee /tmp/outside
          test ! -s /tmp/outside || { echo "pipeline v2 wrote outside data/v2"; exit 1; }

      - name: Commit data/v2 (full runs only)
        if: (inputs.only_tickers || '') == '' && (inputs.limit || '0') == '0'
        run: |
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v2/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "Pipeline v2 $(date -u +%Y-%m-%d) [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              echo "push rejected - remote moved; rebasing onto it and retrying"
              git fetch --unshallow origin "$GITHUB_REF_NAME" 2>/dev/null || git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            }
          fi
