name: Filing library for fmp (text + full XBRL, overwritten each run)

on:
  schedule:
    # Every day 10:30 UTC: after the companies patch (07:00 UTC) and before fmp's weekday routine (16:00 UTC).
    # The first run fetches everything (~1h); later runs fetch only filings not in the library yet.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch every document, not just new ones (true/false)"
        default: "false"
        required: false
      limit:
        description: "Only the N largest companies (smoke test); 0 = all"
        default: "0"
        required: false

permissions:
  contents: write

concurrency:
  group: sec-filings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests yfinance pandas

      - name: Refuse an empty script
        run: test -s fetch_filings.py || { echo "fetch_filings.py is empty"; exit 1; }

      - name: Prove the fetcher first
        run: |
          pip install --quiet pytest
          python -m pytest -q tests/test_fetch_filings.py

      - name: Get the current library (filings branch)
        run: |
          git clone --quiet --depth 1 --branch filings --single-branch \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" filings-store \
            || { echo "no filings branch yet: starting empty"; mkdir -p filings-store; }

      - name: Fetch filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FULL: ${{ inputs.full || 'false' }}
          LIMIT: ${{ inputs.limit || '0' }}
          FILINGS_STORE: filings-store
        run: python fetch_filings.py

      - name: Show report
        run: cat data/filings_report.md

      - name: Publish the library (overwrite the filings branch, one commit, no history)
        run: |
          cd filings-store
          test -d .git || { git init --quiet; }
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --quiet --orphan snapshot
          git add -A
          git commit -q -m "Filing library $(date -u +%Y-%m-%d) [skip ci]"
          git push -q -f origin snapshot:filings

      - name: Commit the changes log (main keeps its history)
        run: |
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/filings_changes.jsonl data/filings_report.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "Filing library changes $(date -u +%Y-%m-%d) [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              echo "push rejected - remote moved; rebasing onto it and retrying"
              git fetch --unshallow origin "$GITHUB_REF_NAME" 2>/dev/null || git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            }
          fi
