name: Build SEC events feed (8-K / 10-K / 10-Q)

on:
  schedule:
    # Every day 03:00 UTC (23:00 ET in summer, 22:00 ET in winter): after EDGAR's
    # 22:00 ET filing cutoff, so a day's 8-Ks are all in the daily index, and before
    # the 08:30 ET pre-open monitor reads data/events_recent.json.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Weekdays of the daily index to scan (nightly default 5; 65 backfills ~90 calendar days)"
        default: "5"
        required: false

permissions:
  contents: write

concurrency:
  group: sec-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install --quiet requests

      - name: Refuse an empty script
        # A phone upload once produced a 0-byte file that "ran" and did nothing.
        run: test -s build_sec_events.py || { echo "build_sec_events.py is empty"; exit 1; }

      - name: Build events feed
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '5' }}
        run: python build_sec_events.py

      - name: Show report
        run: cat data/events_report.md

      - name: Commit results
        run: |
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "SEC events $(date -u +%Y-%m-%d) [skip ci]"
            # Push to the branch this run is on, and only fetch/rebase if the remote
            # moved under us. The old line was hardcoded to main and, against the
            # depth-1 checkout, had no merge base: on any other branch it turned every
            # touched file into an add/add conflict and left the runner on a detached
            # HEAD, so the push failed with exit 128.
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              echo "push rejected - remote moved; rebasing onto it and retrying"
              git fetch --unshallow origin "$GITHUB_REF_NAME" 2>/dev/null || git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            }
          fi
