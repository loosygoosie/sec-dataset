name: Tests

# The two build workflows commit with "[skip ci]", so a nightly data push does not
# drag the suite along with it; a code push does.
on:
  push:
  pull_request:

# A newer push to the same branch makes the older run moot: stop it rather than finish it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requests only because the builder imports it at module scope; the tests
        # themselves touch no network. pypdf: library.py reads PDFs (tests/test_library.py).
        run: pip install --quiet pytest requests pypdf

      - name: Refuse an empty script
        run: test -s build_sec_dataset.py || { echo "build_sec_dataset.py is empty"; exit 1; }

      - name: Run tests
        run: python -m pytest tests/ -q
