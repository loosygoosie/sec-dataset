name: Build S&P 500 SEC dataset

on:
  schedule:
    # Every Sunday 06:00 UTC (02:00 ET in summer, 01:00 ET in winter).
    # Filings land quarterly, so weekly is plenty; the SEC bulk file updates nightly.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand any time

permissions:
  contents: write         # so the job can commit data/ back to the repo

concurrency:
  group: sec-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install --quiet requests

      - name: Refuse an empty script
        # A phone upload once produced a 0-byte file that "ran" and did nothing.
        run: test -s build_sec_dataset.py || { echo "build_sec_dataset.py is empty"; exit 1; }

      - name: Prove the builder before it touches the data
        # This build overwrites every company file and PRUNES any it does not rewrite, and the
        # only other guard is the 3,000-company floor inside the script — which catches a
        # catastrophic parse failure, not a field that is silently wrong for most filers.
        # Which fact wins for a period is the sharpest risk (a restated value reads exactly like
        # an as-filed one), but the patch path, the CIK overrides and the S&P 500 snapshot are all
        # build_sec_dataset.py code this workflow executes, so they are gated too. Same shape as
        # filings.yml's parser gate, and it costs seconds.
        # The three suites left out belong to other builders or to other data:
        # test_filings.py and test_exhibits.py cover build_sec_filings.py / build_sec_events.py,
        # and test_dataset_integrity.py asserts the data already on disk — the PREVIOUS build's —
        # so passing it would vouch for the wrong thing here. It gates that data in tests.yml.
        run: |
          pip install --quiet pytest
          python -m pytest -q \
            tests/test_normaliser.py tests/test_as_filed_shares.py tests/test_share_scale.py \
            tests/test_filing_fallback.py tests/test_cik_overrides.py tests/test_sp500.py \
            tests/test_sic.py

      - name: Build dataset
        env:
          # Set this in the repo: Settings → Secrets and variables → Actions → Secrets → SEC_USER_AGENT (a secret so it is masked in public logs)
          # Format the SEC asks for: "Your Name your@email"  (it is only sent to sec.gov)
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python build_sec_dataset.py

      - name: Show report
        run: cat data/REPORT.md

      - name: Commit results
        run: |
          git config user.name  "sec-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "SEC dataset $(date -u +%Y-%m-%d) [skip ci]"
            # Push to the branch this run is on, and only fetch/rebase if the remote
            # moved under us. The old line was hardcoded to main and, against the
            # depth-1 checkout, had no merge base: on any other branch it turned every
            # touched file into an add/add conflict and left the runner on a detached
            # HEAD, so the push failed with exit 128.
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              echo "push rejected - remote moved; rebasing onto it and retrying"
              git fetch --unshallow origin "$GITHUB_REF_NAME" 2>/dev/null || git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            }
          fi
